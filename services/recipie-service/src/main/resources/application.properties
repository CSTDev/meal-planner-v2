quarkus.http.host=0.0.0.0
# Database configuration
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql
quarkus.hibernate-orm.scripts.generation.create-target=import.sql
%prod.quarkus.datasource.username=hibernate
%prod.quarkus.datasource.password=hibernate
#quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/recipes
quarkus.datasource.jdbc.url=jdbc:postgresql://host.docker.internal:54322/postgres
#quarkus.datasource.username=admin
quarkus.datasource.username=postgres
#quarkus.datasource.password=password
quarkus.datasource.password=postgres
# Flyway configuration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
quarkus.hibernate-orm.database.generation=none
# Kafka configuration
# kafka.bootstrap.servers=kafka:9092
mp.messaging.outgoing.scrape-requests.connector=smallrye-kafka
mp.messaging.outgoing.scrape-requests.topic=scrape-requests
mp.messaging.outgoing.scrape-requests.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.incoming.recipes.topic=scraped-recipes
mp.messaging.incoming.recipes.auto.offset.reset=latest
# mp.messaging.incoming.recipes.value.deserializer=io.quarkus.kafka.client.serialization.ObjectMapperDeserializer
mp.messaging.incoming.recipes.value.type=uk.co.cstdev.data.messaging.RecipeEvent

%dev.mp.jwt.verify.publickey.location=http://host.docker.internal:54321/auth/v1/.well-known/jwks.json
%dev.mp.jwt.verify.issuer=http://host.docker.internal:54321/auth/v1
%dev.quarkus.smallrye-jwt.enabled=true
