name: CI - UI

on:
  push:
    branches: [main]
    paths:
      - "services/menu-planner-ui/**"
      - ".github/workflows/ci-ui.yml"
  pull_request:
    paths:
      - "services/menu-planner-ui/**"
      - ".github/workflows/ci-ui.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/cstdev/meal-planner-ui

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: services/menu-planner-ui/yarn.lock

      - name: Install dependencies
        working-directory: services/menu-planner-ui
        run: yarn install --frozen-lockfile

      - name: Run tests
        working-directory: services/menu-planner-ui
        run: yarn test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: services/menu-planner-ui
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update homelab digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/update-homelab-digest
        with:
          service-key: ui
          digest: ${{ steps.push.outputs.digest }}
          homelab-pat: ${{ secrets.HOMELAB_DEPLOY_PAT }}
