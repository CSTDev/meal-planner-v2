name: CI - Recipe Service

on:
  push:
    branches: [main]
    paths:
      - "services/recipie-service/**"
      - ".github/workflows/ci-recipe-service.yml"
  pull_request:
    paths:
      - "services/recipie-service/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/cstdev/meal-planner-recipe-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build with Maven
        working-directory: services/recipie-service
        run: ./mvnw -B package -DskipTests

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/recipie-service
          file: services/recipie-service/src/main/docker/Dockerfile.jvm
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
